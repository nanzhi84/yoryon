# E2E 依赖：独立端口的 postgres + mailpit + caddy（Caddy 模拟生产 XFF 覆写）。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yoryon_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yoryon_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "11125:1025"
      - "11126:8025"
    environment:
      MP_MAX_MESSAGES: "5000"

  # 模拟生产 Caddy：覆写 X-Forwarded-For，测试 IP 信任链
  caddy:
    image: caddy:2
    ports:
      - "4199:4199"
    volumes:
      - ./Caddyfile.e2e:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
