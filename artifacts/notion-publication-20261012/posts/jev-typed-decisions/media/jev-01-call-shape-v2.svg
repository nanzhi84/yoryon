<text x="828" y="216" font-family="Menlo,Consolas,monospace" font-size="22" fill="#2C2C2B" font-weight="bold">billing</text>
<text x="1112" y="216" font-family="Menlo,Consolas,monospace" font-size="13" fill="#7D7A75" text-anchor="end">P 0.91</text>
<rect x="1064" y="168" width="64" height="22" rx="11" fill="#E5F2FC"/>
<text x="1096" y="183" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#2783DE" text-anchor="middle">Choice</text>

<!-- answer card 2 -->
<rect x="804" y="252" width="332" height="76" rx="10" fill="#F9F8F7"/>
<text x="828" y="280" font-family="Menlo,Consolas,monospace" font-size="13" fill="#A3A19C">effort · score</text>
<text x="828" y="312" font-family="Menlo,Consolas,monospace" font-size="22" fill="#2C2C2B" font-weight="bold">2.1</text>
<text x="1112" y="312" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#7D7A75" text-anchor="end">1-3 档加权</text>
<rect x="1064" y="264" width="64" height="22" rx="11" fill="#E8F1EC"/>
<text x="1096" y="279" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#46A171" text-anchor="middle">Score</text>

<!-- answer card 3 -->
<rect x="804" y="348" width="332" height="76" rx="10" fill="#F9F8F7"/>
<text x="828" y="376" font-family="Menlo,Consolas,monospace" font-size="13" fill="#A3A19C">refund_requested · noul</text>
<text x="828" y="408" font-family="Menlo,Consolas,monospace" font-size="22" fill="#2C2C2B" font-weight="bold">0.03</text>
<text x="1112" y="408" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#7D7A75" text-anchor="end">倾向否</text>
<rect x="1064" y="360" width="64" height="22" rx="11" fill="#FBEBDE"/>
<text x="1096" y="375" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#D5803B" text-anchor="middle">Noul</text>

<!-- ========== Bottom strip ========== -->
<rect x="40" y="486" width="1120" height="50" rx="12" fill="#F9F8F7" stroke="#E6E5E3" stroke-width="1"/>
<text x="600" y="518" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#5B5B58" text-anchor="middle">同一份 state 共享给所有问题；组装输入与消费结果始终在应用侧</text>
</svg>
