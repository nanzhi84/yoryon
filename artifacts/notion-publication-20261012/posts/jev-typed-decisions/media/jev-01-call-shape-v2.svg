<rect x="64" y="120" width="332" height="150" rx="10" fill="#F9F8F7"/>
<text x="84" y="150" font-family="Menlo,Consolas,monospace" font-size="18" fill="#2C2C2B" font-weight="bold">state</text>
<text x="376" y="150" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#A3A19C" text-anchor="end">字段由应用自定义</text>
