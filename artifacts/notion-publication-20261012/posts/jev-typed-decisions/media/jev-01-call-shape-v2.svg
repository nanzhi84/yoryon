<text x="344" y="348" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#2783DE" text-anchor="middle">Choice</text>

<text x="84" y="378" font-family="Menlo,Consolas,monospace" font-size="14" fill="#2C2C2B">effort</text>
<rect x="312" y="363" width="64" height="22" rx="11" fill="#E8F1EC"/>
<text x="344" y="378" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#46A171" text-anchor="middle">Score</text>

<text x="84" y="408" font-family="Menlo,Consolas,monospace" font-size="14" fill="#2C2C2B">refund_requested</text>
<rect x="312" y="393" width="64" height="22" rx="11" fill="#FBEBDE"/>
<text x="344" y="408" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#D5803B" text-anchor="middle">Noul</text>

<!-- ========== Center: Jev ========== -->
<rect x="510" y="168" width="180" height="180" rx="18" fill="#E5F2FC"/>
<text x="600" y="240" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="30" fill="#2783DE" font-weight="bold" text-anchor="middle">Jev</text>
<text x="600" y="270" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#2C2C2B" text-anchor="middle">一次调用</text>
<text x="600" y="296" font-family="Menlo,Consolas,monospace" font-size="13" fill="#5B5B58" text-anchor="middle">共享 state</text>

<!-- Arrows -->
<line x1="428" y1="258" x2="502" y2="258" stroke="#A3A19C" stroke-width="2" marker-end="url(#arr)"/>
<line x1="698" y1="258" x2="772" y2="258" stroke="#A3A19C" stroke-width="2" marker-end="url(#arr)"/>

