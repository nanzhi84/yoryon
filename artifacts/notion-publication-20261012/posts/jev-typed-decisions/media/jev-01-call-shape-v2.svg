<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
<rect width="1200" height="540" fill="#FFFFFF"/>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3A19C"/></marker>
</defs>

<!-- ========== Left card: inputs ========== -->
<rect x="40" y="60" width="380" height="396" rx="14" fill="#FFFFFF" stroke="#E6E5E3" stroke-width="1.5"/>
