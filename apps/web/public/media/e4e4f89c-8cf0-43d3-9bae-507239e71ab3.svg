<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-label="修改文件之后、执行 git add 之后、执行 git diff --staged 三个阶段对比">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#2C2C2B"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#2783DE"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#9A5CC6"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#D9741C"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#D9363E"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#1D8A56"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#666664"/></marker>
  </defs>
  <rect width="960" height="452" fill="#FFFFFF"/>
  <text x="480" y="28" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="600" fill="#2C2C2B" text-anchor="middle">三个阶段对比：为什么 git add 之后直接运行 git diff 没有输出</text>
  <line x1="314" y1="75" x2="334" y2="75" stroke="#2C2C2B" stroke-width="1.7" marker-end="url(#arr-dark)"/>
  <line x1="626" y1="75" x2="646" y2="75" stroke="#2C2C2B" stroke-width="1.7" marker-end="url(#arr-dark)"/>
  <rect x="24" y="46" width="288" height="374" rx="8" fill="#F7F7F5" stroke="#D4D4D0" stroke-width="1.5"/>
  <rect x="38" y="58" width="260" height="34" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="168" y="80" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="600" fill="#2783DE" text-anchor="middle">1. 修改文件之后</text>
  <text x="40" y="127" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">工作区</text>
  <rect x="90" y="108" width="150" height="30" rx="6" fill="#FDF3E7" stroke="#D9741C" stroke-width="1.4"/>
  <text x="165" y="127" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#D9741C" text-anchor="middle">return "Hello, Git"</text>
  <text x="40" y="165" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">暂存区</text>
  <rect x="90" y="146" width="150" height="30" rx="6" fill="#F7F7F5" stroke="#B8B8B2" stroke-width="1.4"/>
  <text x="165" y="165" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="normal" fill="#2C2C2B" text-anchor="middle">return "Hello"</text>
  <text x="40" y="203" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">HEAD</text>
  <rect x="90" y="184" width="150" height="30" rx="6" fill="#F7F7F5" stroke="#B8B8B2" stroke-width="1.4"/>
  <text x="165" y="203" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="normal" fill="#2C2C2B" text-anchor="middle">return "Hello"</text>
  <path d="M 244 123 L 258 123 L 258 161 L 244 161" fill="none" stroke="#666664" stroke-width="1.4"/>
  <text x="264" y="146" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#2783DE" text-anchor="start">不同</text>
  <rect x="38" y="230" width="260" height="118" rx="8" fill="#FFFFFF" stroke="#D4D4D0" stroke-width="1.3"/>
  <text x="50" y="250" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="normal" fill="#666664" text-anchor="start">终端执行</text>
  <text x="50" y="272" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" font-weight="600" fill="#2C2C2B" text-anchor="start">$ git diff</text>
  <rect x="48" y="284" width="240" height="24" rx="4" fill="#FDECEE" stroke="#D9363E" stroke-width="1"/>
  <text x="56" y="300" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="normal" fill="#D9363E" text-anchor="start">- return "Hello"</text>
  <rect x="48" y="314" width="240" height="24" rx="4" fill="#E8F6EF" stroke="#1D8A56" stroke-width="1"/>
  <text x="56" y="330" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="normal" fill="#1D8A56" text-anchor="start">+ return "Hello, Git"</text>
  <text x="168" y="372" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">默认对比工作区与暂存区，</text>
  <text x="168" y="392" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#666664" text-anchor="middle">显示尚未暂存的改动。</text>
  <rect x="336" y="46" width="288" height="374" rx="8" fill="#F7F7F5" stroke="#D4D4D0" stroke-width="1.5"/>
  <rect x="350" y="58" width="260" height="34" rx="8" fill="#FDF3E7" stroke="#D9741C" stroke-width="1.5"/>
  <text x="480" y="80" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="600" fill="#D9741C" text-anchor="middle">2. 执行 git add app.py 之后</text>
  <text x="352" y="127" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">工作区</text>
  <rect x="402" y="108" width="150" height="30" rx="6" fill="#F7F7F5" stroke="#B8B8B2" stroke-width="1.4"/>
  <text x="477" y="127" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="normal" fill="#2C2C2B" text-anchor="middle">return "Hello, Git"</text>
  <text x="352" y="165" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">暂存区</text>
  <rect x="402" y="146" width="150" height="30" rx="6" fill="#FDF3E7" stroke="#D9741C" stroke-width="1.4"/>
  <text x="477" y="165" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#D9741C" text-anchor="middle">return "Hello, Git"</text>
  <text x="352" y="203" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">HEAD</text>
  <rect x="402" y="184" width="150" height="30" rx="6" fill="#F7F7F5" stroke="#B8B8B2" stroke-width="1.4"/>
  <text x="477" y="203" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="normal" fill="#2C2C2B" text-anchor="middle">return "Hello"</text>
  <path d="M 556 123 L 570 123 L 570 161 L 556 161" fill="none" stroke="#666664" stroke-width="1.4"/>
  <text x="576" y="146" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#666664" text-anchor="start">相同</text>
  <rect x="350" y="230" width="260" height="118" rx="8" fill="#FFFFFF" stroke="#D4D4D0" stroke-width="1.3"/>
  <text x="362" y="250" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="normal" fill="#666664" text-anchor="start">终端执行</text>
  <text x="362" y="272" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" font-weight="600" fill="#2C2C2B" text-anchor="start">$ git diff</text>
  <rect x="360" y="286" width="240" height="46" rx="6" fill="#F7F7F5" stroke="#D4D4D0" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="480" y="313" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11.5" font-weight="normal" fill="#666664" text-anchor="middle">（没有任何输出）</text>
  <text x="480" y="372" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">git add 已把暂存区更新至与工作区</text>
  <text x="480" y="392" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#666664" text-anchor="middle">完全一致，因此 git diff 无差异。</text>
  <rect x="648" y="46" width="288" height="374" rx="8" fill="#F7F7F5" stroke="#D4D4D0" stroke-width="1.5"/>
  <rect x="662" y="58" width="260" height="34" rx="8" fill="#E8F6EF" stroke="#1D8A56" stroke-width="1.5"/>
  <text x="792" y="80" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="600" fill="#1D8A56" text-anchor="middle">3. 执行 git diff --staged</text>
  <text x="664" y="127" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">工作区</text>
  <rect x="714" y="108" width="150" height="30" rx="6" fill="#F7F7F5" stroke="#B8B8B2" stroke-width="1.4"/>
  <text x="789" y="127" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="normal" fill="#2C2C2B" text-anchor="middle">return "Hello, Git"</text>
  <text x="664" y="165" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">暂存区</text>
  <rect x="714" y="146" width="150" height="30" rx="6" fill="#E8F6EF" stroke="#1D8A56" stroke-width="1.4"/>
  <text x="789" y="165" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#1D8A56" text-anchor="middle">return "Hello, Git"</text>
  <text x="664" y="203" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">HEAD</text>
  <rect x="714" y="184" width="150" height="30" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.4"/>
  <text x="789" y="203" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#2783DE" text-anchor="middle">return "Hello"</text>
  <path d="M 868 161 L 882 161 L 882 199 L 868 199" fill="none" stroke="#666664" stroke-width="1.4"/>
  <text x="888" y="184" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#1D8A56" text-anchor="start">不同</text>
  <rect x="662" y="230" width="260" height="118" rx="8" fill="#FFFFFF" stroke="#D4D4D0" stroke-width="1.3"/>
  <text x="674" y="250" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="normal" fill="#666664" text-anchor="start">终端执行</text>
  <text x="674" y="272" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" font-weight="600" fill="#2C2C2B" text-anchor="start">$ git diff --staged</text>
  <rect x="672" y="284" width="240" height="24" rx="4" fill="#FDECEE" stroke="#D9363E" stroke-width="1"/>
  <text x="680" y="300" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="normal" fill="#D9363E" text-anchor="start">- return "Hello"</text>
  <rect x="672" y="314" width="240" height="24" rx="4" fill="#E8F6EF" stroke="#1D8A56" stroke-width="1"/>
  <text x="680" y="330" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="normal" fill="#1D8A56" text-anchor="start">+ return "Hello, Git"</text>
  <text x="792" y="372" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">加上 --staged 后改为对比暂存区</text>
  <text x="792" y="392" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#666664" text-anchor="middle">与 HEAD，显示待提交的改动。</text>
  <text x="480" y="440" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11.5" font-weight="normal" fill="#666664" text-anchor="middle">注：图中 HEAD 代表上一次已正式提交并保存进 .git 的最新历史版本。</text>
</svg>
