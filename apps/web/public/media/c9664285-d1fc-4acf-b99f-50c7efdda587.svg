<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Cherry-Pick 的三路合并计算原理">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#2C2C2B"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#2783DE"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#9A5CC6"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#D9741C"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#D9363E"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#1D8A56"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#666664"/></marker>
  </defs>
  <rect width="920" height="400" fill="#FFFFFF"/>
  <text x="460" y="28" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="600" fill="#2C2C2B" text-anchor="middle">Cherry-Pick 原理：为什么只提取了 F2 的改动而不带走 F1</text>
  <rect x="45" y="52" width="830" height="146" rx="8" fill="#F7F7F5" stroke="#D4D4D0" stroke-width="1.5"/>
  <text x="65" y="76" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2B" text-anchor="start">版本演化效果：在 main (M2) 上执行 git cherry-pick -x F2</text>
  <rect x="73" y="94" width="64" height="34" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="105" y="116" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="600" fill="#2783DE" text-anchor="middle">M0</text>
  <rect x="193" y="94" width="64" height="34" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="225" y="116" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="600" fill="#2783DE" text-anchor="middle">M1</text>
  <rect x="338" y="94" width="64" height="34" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="370" y="116" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="600" fill="#2783DE" text-anchor="middle">M2</text>
  <rect x="533" y="94" width="64" height="34" rx="8" fill="#E8F6EF" stroke="#1D8A56" stroke-width="1.5"/>
  <text x="565" y="116" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="600" fill="#1D8A56" text-anchor="middle">F2'</text>
  <line x1="137" y1="112" x2="191" y2="112" stroke="#2783DE" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <line x1="257" y1="112" x2="336" y2="112" stroke="#2783DE" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <line x1="402" y1="112" x2="531" y2="112" stroke="#1D8A56" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="666" y="116" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="600" fill="#1D8A56" text-anchor="start">main (当前分支)</text>
  <rect x="303" y="148" width="64" height="34" rx="8" fill="#F3EAF9" stroke="#9A5CC6" stroke-width="1.5"/>
  <text x="335" y="170" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="600" fill="#9A5CC6" text-anchor="middle">F1</text>
  <rect x="433" y="148" width="64" height="34" rx="8" fill="#FDF3E7" stroke="#D9741C" stroke-width="1.5"/>
  <text x="465" y="170" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="600" fill="#D9741C" text-anchor="middle">F2</text>
  <rect x="563" y="148" width="64" height="34" rx="8" fill="#F7F7F5" stroke="#B8B8B2" stroke-width="1.5"/>
  <text x="595" y="170" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="600" fill="#666664" text-anchor="middle">F3</text>
  <path d="M 245 128 L 285 166 L 301 166" fill="none" stroke="#9A5CC6" stroke-width="1.6" marker-end="url(#arr-purple)"/>
  <line x1="367" y1="166" x2="431" y2="166" stroke="#9A5CC6" stroke-width="1.6" marker-end="url(#arr-purple)"/>
  <line x1="497" y1="166" x2="561" y2="166" stroke="#666664" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="666" y="170" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11.5" font-weight="600" fill="#9A5CC6" text-anchor="start">feat-profile (F1 与 F3 不受影响)</text>
  <path d="M 480 148 L 535 124" fill="none" stroke="#D9741C" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-orange)"/>
  <text x="468" y="134" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#D9741C" text-anchor="middle">提取单步增量</text>
  <rect x="45" y="214" width="830" height="152" rx="8" fill="#F7F7F5" stroke="#D4D4D0" stroke-width="1.5"/>
  <text x="65" y="238" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2B" text-anchor="start">底层计算：用三路合并算出单步净增量并叠加到 M2（新提交生成全新 Hash）</text>
  <rect x="70" y="258" width="180" height="86" rx="8" fill="#F3EAF9" stroke="#9A5CC6" stroke-width="1.5"/>
  <text x="160" y="282" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="600" fill="#9A5CC6" text-anchor="middle">对比起点 Base = F1</text>
  <text x="160" y="304" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">F2 的上一版本（F2^）</text>
  <text x="160" y="324" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="normal" fill="#666664" text-anchor="middle">用来剥离更早之前的改动</text>
  <rect x="272" y="258" width="182" height="86" rx="8" fill="#FDF3E7" stroke="#D9741C" stroke-width="1.5"/>
  <text x="363" y="282" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="600" fill="#D9741C" text-anchor="middle">目标版本 = F2</text>
  <text x="363" y="304" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">对比 F1 -&gt; F2 的差异</text>
  <text x="363" y="324" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="normal" fill="#666664" text-anchor="middle">精确算出 F2 这一次的改动</text>
  <rect x="476" y="258" width="182" height="86" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="567" y="282" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="600" fill="#2783DE" text-anchor="middle">当前版本 = M2</text>
  <text x="567" y="304" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">main 分支当前的快照</text>
  <text x="567" y="324" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="normal" fill="#666664" text-anchor="middle">保留 M2 已有的全部修改</text>
  <line x1="658" y1="301" x2="692" y2="301" stroke="#1D8A56" stroke-width="2.0" marker-end="url(#arr-green)"/>
  <rect x="694" y="258" width="162" height="86" rx="8" fill="#E8F6EF" stroke="#1D8A56" stroke-width="1.5"/>
  <text x="775" y="282" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="600" fill="#1D8A56" text-anchor="middle">新提交 F2'</text>
  <text x="775" y="304" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">上一版本变为 M2</text>
  <text x="775" y="324" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="normal" fill="#1D8A56" text-anchor="middle">因此获得全新 Hash</text>
  <text x="460" y="386" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11.5" font-weight="normal" fill="#666664" text-anchor="middle">只有当 F1 -&gt; F2 与 F1 -&gt; M2 修改了同一文件的相同行且内容不一致时，Git 才会暂停提示冲突。</text>
</svg>
