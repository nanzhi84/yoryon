<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390" role="img" aria-label="Git 中单个文件的四种状态与核心命令流转">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#2C2C2B"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#2783DE"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#9A5CC6"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#D9741C"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#D9363E"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#1D8A56"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#666664"/></marker>
  </defs>
  <rect width="920" height="390" fill="#FFFFFF"/>
  <text x="460" y="28" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="600" fill="#2C2C2B" text-anchor="middle">Git 中单个文件的四种状态与核心命令流转</text>
  <path d="M 811 124 L 811 86 L 343 86 L 343 122" fill="none" stroke="#D9741C" stroke-width="1.8" marker-end="url(#arr-orange)"/>
  <text x="577" y="74" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11.5" font-weight="600" fill="#D9741C" text-anchor="middle">再次执行 git add（纳入下一版本清单）</text>
  <rect x="30" y="124" width="158" height="140" rx="8" fill="#F7F7F5" stroke="#B8B8B2" stroke-width="1.5"/>
  <text x="109" y="154" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="600" fill="#2C2C2B" text-anchor="middle">1. 未跟踪</text>
  <text x="109" y="174" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" font-weight="normal" fill="#666664" text-anchor="middle">(Untracked)</text>
  <text x="109" y="206" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">新创建的本地文件</text>
  <text x="109" y="226" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#666664" text-anchor="middle">尚未纳入 Git 管理</text>
  <rect x="264" y="124" width="158" height="140" rx="8" fill="#FDF3E7" stroke="#D9741C" stroke-width="1.5"/>
  <text x="343" y="154" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="600" fill="#D9741C" text-anchor="middle">2. 已暂存</text>
  <text x="343" y="174" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" font-weight="normal" fill="#D9741C" text-anchor="middle">(Staged)</text>
  <text x="343" y="206" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">已登记进待提交清单</text>
  <text x="343" y="226" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#666664" text-anchor="middle">准备生成下一版本</text>
  <rect x="498" y="124" width="158" height="140" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="577" y="154" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="600" fill="#2783DE" text-anchor="middle">3. 已提交</text>
  <text x="577" y="174" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" font-weight="normal" fill="#2783DE" text-anchor="middle">(Committed)</text>
  <text x="577" y="206" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">已安全存入本地</text>
  <text x="577" y="226" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#666664" text-anchor="middle">.git 历史版本库</text>
  <rect x="732" y="124" width="158" height="140" rx="8" fill="#F3EAF9" stroke="#9A5CC6" stroke-width="1.5"/>
  <text x="811" y="154" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="600" fill="#9A5CC6" text-anchor="middle">4. 已修改</text>
  <text x="811" y="174" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" font-weight="normal" fill="#9A5CC6" text-anchor="middle">(Modified)</text>
  <text x="811" y="206" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">已管理的文件有改动</text>
  <text x="811" y="226" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#666664" text-anchor="middle">新修改尚未暂存</text>
  <line x1="188" y1="194" x2="262" y2="194" stroke="#D9741C" stroke-width="1.8" marker-end="url(#arr-orange)"/>
  <text x="226" y="180" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" font-weight="600" fill="#D9741C" text-anchor="middle">git add</text>
  <line x1="422" y1="194" x2="496" y2="194" stroke="#2783DE" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="460" y="180" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#2783DE" text-anchor="middle">git commit</text>
  <line x1="656" y1="194" x2="730" y2="194" stroke="#9A5CC6" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <text x="694" y="180" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#9A5CC6" text-anchor="middle">编辑保存</text>
  <text x="694" y="214" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#666664" text-anchor="middle">文件内容</text>
  <rect x="30" y="290" width="860" height="76" rx="8" fill="#F7F7F5" stroke="#D4D4D0" stroke-width="1.5"/>
  <text x="460" y="318" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="600" fill="#2C2C2B" text-anchor="middle">执行 git status 可以随时查看工作目录中的每个文件当前正处于上述哪一种状态。</text>
  <text x="460" y="344" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11.5" font-weight="normal" fill="#666664" text-anchor="middle">不需要保存进版本库的文件（例如 .env 密钥或系统缓存）可在 .gitignore 中配置忽略规则，保持不被跟踪。</text>
</svg>
