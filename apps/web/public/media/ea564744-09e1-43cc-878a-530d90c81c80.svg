<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480">
  <rect width="1240" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7D7A75"/>
    </marker>
  </defs>

  <!-- ============ 列 1：单步决策（Agent Loop） ============ -->
  <text x="60" y="62" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="24" fill="#2C2C2B" font-weight="bold">① 当前一步怎么选</text>
  <text x="60" y="92" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#7D7A75">Jev 作为 Agent 循环的决策原语</text>

  <!-- top: 应用状态 -->
  <rect x="140" y="112" width="180" height="58" rx="12" fill="#F9F8F7" stroke="#E6E5E3" stroke-width="1.5"/>
  <text x="230" y="148" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="20" fill="#2C2C2B" text-anchor="middle">应用状态</text>

  <!-- right: Jev 选择动作 -->
  <rect x="268" y="227" width="132" height="62" rx="12" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="334" y="252" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#2783DE" font-weight="bold" text-anchor="middle">Jev 选择</text>
  <text x="334" y="276" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#2783DE" font-weight="bold" text-anchor="middle">动作</text>

  <!-- bottom: 执行工具 -->
  <rect x="140" y="342" width="180" height="58" rx="12" fill="#F9F8F7" stroke="#E6E5E3" stroke-width="1.5"/>
  <text x="230" y="378" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="20" fill="#2C2C2B" text-anchor="middle">执行工具</text>

  <!-- left: 更新状态 -->
  <rect x="60" y="227" width="132" height="62" rx="12" fill="#F9F8F7" stroke="#E6E5E3" stroke-width="1.5"/>
  <text x="126" y="265" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="20" fill="#2C2C2B" text-anchor="middle">更新状态</text>

  <!-- loop arrows -->
  <line x1="300" y1="172" x2="326" y2="219" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="306" y1="291" x2="272" y2="334" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="158" y1="340" x2="132" y2="297" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="146" y1="223" x2="178" y2="178" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>

  <text x="230" y="452" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#7D7A75" text-anchor="middle">目标、状态与流程由应用层维护</text>

  <line x1="420" y1="40" x2="420" y2="440" stroke="#E6E5E3" stroke-width="1.5"/>

  <!-- ============ 列 2：分层筛选 ============ -->
  <text x="460" y="62" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="24" fill="#2C2C2B" font-weight="bold">② 候选分层筛选</text>
  <text x="460" y="92" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#7D7A75">候选太多时先分大类，再统一比较</text>

  <rect x="520" y="112" width="180" height="54" rx="12" fill="#F9F8F7" stroke="#E6E5E3" stroke-width="1.5"/>
  <text x="610" y="146" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="20" fill="#2C2C2B" text-anchor="middle">100 个候选工具</text>

  <line x1="610" y1="168" x2="610" y2="194" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="510" y="198" width="200" height="54" rx="12" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="610" y="232" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="20" fill="#2783DE" font-weight="bold" text-anchor="middle">Jev 判断所属大类</text>

  <!-- groups -->
  <line x1="556" y1="254" x2="492" y2="290" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="610" y1="254" x2="610" y2="290" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="664" y1="254" x2="728" y2="290" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="442" y="294" width="100" height="54" rx="10" fill="#F9F8F7" stroke="#E6E5E3" stroke-width="1.5"/>
  <text x="492" y="328" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#2C2C2B" text-anchor="middle">查询类</text>
  <rect x="560" y="294" width="100" height="54" rx="10" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5"/>
  <text x="610" y="328" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#46A171" font-weight="bold" text-anchor="middle">账务类</text>
  <rect x="678" y="294" width="100" height="54" rx="10" fill="#F9F8F7" stroke="#E6E5E3" stroke-width="1.5"/>
  <text x="728" y="328" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#2C2C2B" text-anchor="middle">其他</text>

  <!-- converge -->
  <line x1="492" y1="350" x2="556" y2="394" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="610" y1="350" x2="610" y2="394" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="728" y1="350" x2="664" y2="394" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="500" y="398" width="220" height="54" rx="12" fill="#F9F8F7" stroke="#E6E5E3" stroke-width="1.5"/>
  <text x="610" y="432" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="20" fill="#2C2C2B" text-anchor="middle">入围候选统一比较</text>

  <line x1="800" y1="40" x2="800" y2="440" stroke="#E6E5E3" stroke-width="1.5"/>

  <!-- ============ 列 3：上下文筛选 ============ -->
  <text x="840" y="62" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="24" fill="#2C2C2B" font-weight="bold">③ 上下文筛选</text>
  <text x="840" y="92" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#7D7A75">只把相关内容放进模型上下文</text>

  <rect x="910" y="112" width="180" height="54" rx="12" fill="#F9F8F7" stroke="#E6E5E3" stroke-width="1.5"/>
  <text x="1000" y="146" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="20" fill="#2C2C2B" text-anchor="middle">候选上下文 ×N</text>

  <line x1="1000" y1="168" x2="1000" y2="194" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="900" y="198" width="200" height="54" rx="12" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="1000" y="232" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="20" fill="#2783DE" font-weight="bold" text-anchor="middle">Jev 逐条判断相关性</text>

  <line x1="956" y1="254" x2="916" y2="306" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1044" y1="254" x2="1084" y2="306" stroke="#7D7A75" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="840" y="310" width="150" height="80" rx="12" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5"/>
  <text x="915" y="342" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#46A171" font-weight="bold" text-anchor="middle">相关</text>
  <text x="915" y="370" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#2C2C2B" text-anchor="middle">进入上下文</text>

  <rect x="1010" y="310" width="150" height="80" rx="12" fill="#F0EFED" stroke="#E6E5E3" stroke-width="1.5"/>
  <text x="1085" y="342" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#7D7A75" text-anchor="middle">不相关</text>
  <text x="1085" y="370" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#7D7A75" text-anchor="middle">排除</text>

  <text x="1000" y="452" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#7D7A75" text-anchor="middle">由程序组装最终上下文</text>
</svg>
