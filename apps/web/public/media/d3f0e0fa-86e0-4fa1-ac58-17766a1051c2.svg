<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="git reset 三种模式的状态对比">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#2C2C2B"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#2783DE"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#9A5CC6"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#D9741C"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#D9363E"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#1D8A56"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9 5 L 0.5 8.8 L 2.5 5 z" fill="#666664"/></marker>
  </defs>
  <rect width="960" height="500" fill="#FFFFFF"/>
  <text x="480" y="28" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="600" fill="#2C2C2B" text-anchor="middle">git reset 三种模式的状态对比（从版本 V2 回退一步至 V1）</text>
  <rect x="24" y="44" width="912" height="58" rx="8" fill="#F7F7F5" stroke="#D4D4D0" stroke-width="1.5"/>
  <text x="40" y="78" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="600" fill="#2C2C2B" text-anchor="start">执行 reset 之前的初始状态（刚提交完 V2）：</text>
  <rect x="344" y="56" width="182" height="34" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.4"/>
  <text x="435" y="77" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#2783DE" text-anchor="middle">工作区 = V2 ("Hello, Git")</text>
  <rect x="536" y="56" width="182" height="34" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.4"/>
  <text x="627" y="77" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#2783DE" text-anchor="middle">暂存区 = V2 ("Hello, Git")</text>
  <rect x="728" y="56" width="192" height="34" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.4"/>
  <text x="824" y="77" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#2783DE" text-anchor="middle">HEAD = V2 ("Hello, Git")</text>
  <rect x="24" y="118" width="288" height="348" rx="8" fill="#F7F7F5" stroke="#D4D4D0" stroke-width="1.5"/>
  <rect x="38" y="130" width="260" height="34" rx="8" fill="#F3EAF9" stroke="#9A5CC6" stroke-width="1.5"/>
  <text x="168" y="152" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" font-weight="600" fill="#9A5CC6" text-anchor="middle">1. git reset --soft HEAD~1</text>
  <text x="40" y="199" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">工作区</text>
  <rect x="88" y="180" width="150" height="30" rx="6" fill="#F7F7F5" stroke="#B8B8B2" stroke-width="1.4"/>
  <text x="163" y="199" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="normal" fill="#2C2C2B" text-anchor="middle">V2: "Hello, Git"</text>
  <text x="246" y="199" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#666664" text-anchor="start">不变</text>
  <text x="40" y="237" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">暂存区</text>
  <rect x="88" y="218" width="150" height="30" rx="6" fill="#E8F6EF" stroke="#1D8A56" stroke-width="1.4"/>
  <text x="163" y="237" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#1D8A56" text-anchor="middle">V2: "Hello, Git"</text>
  <text x="246" y="237" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#1D8A56" text-anchor="start">不变</text>
  <text x="40" y="275" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">HEAD</text>
  <rect x="88" y="256" width="150" height="30" rx="6" fill="#F3EAF9" stroke="#9A5CC6" stroke-width="1.4"/>
  <text x="163" y="275" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#9A5CC6" text-anchor="middle">V1: "Hello"</text>
  <text x="246" y="275" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#9A5CC6" text-anchor="start">已回退</text>
  <rect x="38" y="302" width="260" height="98" rx="8" fill="#FFFFFF" stroke="#D4D4D0" stroke-width="1.3"/>
  <text x="48" y="320" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="normal" fill="#666664" text-anchor="start">执行后运行 git status</text>
  <text x="48" y="340" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" font-weight="normal" fill="#2C2C2B" text-anchor="start">Changes to be committed:</text>
  <rect x="48" y="349" width="240" height="24" rx="4" fill="#E8F6EF" stroke="#1D8A56" stroke-width="1"/>
  <text x="56" y="365" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="normal" fill="#1D8A56" text-anchor="start">modified: app.py</text>
  <text x="280" y="365" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10" font-weight="600" fill="#1D8A56" text-anchor="end">已暂存</text>
  <text x="168" y="391" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="normal" fill="#1D8A56" text-anchor="middle">可直接重新执行 git commit</text>
  <text x="168" y="424" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">只退回分支指针；V2 的改动</text>
  <text x="168" y="444" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#666664" text-anchor="middle">原封不动留在暂存区。</text>
  <rect x="336" y="118" width="288" height="348" rx="8" fill="#F7F7F5" stroke="#D4D4D0" stroke-width="1.5"/>
  <rect x="350" y="130" width="260" height="34" rx="8" fill="#FDF3E7" stroke="#D9741C" stroke-width="1.5"/>
  <text x="480" y="152" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" font-weight="600" fill="#D9741C" text-anchor="middle">2. git reset HEAD~1 (默认 mixed)</text>
  <text x="352" y="199" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">工作区</text>
  <rect x="400" y="180" width="150" height="30" rx="6" fill="#FDF3E7" stroke="#D9741C" stroke-width="1.4"/>
  <text x="475" y="199" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#D9741C" text-anchor="middle">V2: "Hello, Git"</text>
  <text x="558" y="199" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#D9741C" text-anchor="start">不变</text>
  <text x="352" y="237" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">暂存区</text>
  <rect x="400" y="218" width="150" height="30" rx="6" fill="#F3EAF9" stroke="#9A5CC6" stroke-width="1.4"/>
  <text x="475" y="237" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#9A5CC6" text-anchor="middle">V1: "Hello"</text>
  <text x="558" y="237" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#9A5CC6" text-anchor="start">已回退</text>
  <text x="352" y="275" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">HEAD</text>
  <rect x="400" y="256" width="150" height="30" rx="6" fill="#F3EAF9" stroke="#9A5CC6" stroke-width="1.4"/>
  <text x="475" y="275" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#9A5CC6" text-anchor="middle">V1: "Hello"</text>
  <text x="558" y="275" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#9A5CC6" text-anchor="start">已回退</text>
  <rect x="350" y="302" width="260" height="98" rx="8" fill="#FFFFFF" stroke="#D4D4D0" stroke-width="1.3"/>
  <text x="360" y="320" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="normal" fill="#666664" text-anchor="start">执行后运行 git status</text>
  <text x="360" y="340" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" font-weight="normal" fill="#2C2C2B" text-anchor="start">Changes not staged for commit:</text>
  <rect x="360" y="349" width="240" height="24" rx="4" fill="#FDF3E7" stroke="#D9741C" stroke-width="1"/>
  <text x="368" y="365" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="normal" fill="#D9741C" text-anchor="start">modified: app.py</text>
  <text x="592" y="365" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10" font-weight="600" fill="#D9741C" text-anchor="end">未暂存</text>
  <text x="480" y="391" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="normal" fill="#D9741C" text-anchor="middle">需重新 git add 再执行 commit</text>
  <text x="480" y="424" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">退回指针与暂存区；V2 的改动</text>
  <text x="480" y="444" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#666664" text-anchor="middle">完整保留在工作区文件中。</text>
  <rect x="648" y="118" width="288" height="348" rx="8" fill="#F7F7F5" stroke="#D4D4D0" stroke-width="1.5"/>
  <rect x="662" y="130" width="260" height="34" rx="8" fill="#FDECEE" stroke="#D9363E" stroke-width="1.5"/>
  <text x="792" y="152" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" font-weight="600" fill="#D9363E" text-anchor="middle">3. git reset --hard HEAD~1</text>
  <text x="664" y="199" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">工作区</text>
  <rect x="712" y="180" width="150" height="30" rx="6" fill="#FDECEE" stroke="#D9363E" stroke-width="1.4"/>
  <text x="787" y="199" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#D9363E" text-anchor="middle">V1: "Hello"</text>
  <text x="870" y="199" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#D9363E" text-anchor="start">覆盖回退</text>
  <text x="664" y="237" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">暂存区</text>
  <rect x="712" y="218" width="150" height="30" rx="6" fill="#FDECEE" stroke="#D9363E" stroke-width="1.4"/>
  <text x="787" y="237" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#D9363E" text-anchor="middle">V1: "Hello"</text>
  <text x="870" y="237" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#D9363E" text-anchor="start">已回退</text>
  <text x="664" y="275" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600" fill="#666664" text-anchor="start">HEAD</text>
  <rect x="712" y="256" width="150" height="30" rx="6" fill="#FDECEE" stroke="#D9363E" stroke-width="1.4"/>
  <text x="787" y="275" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#D9363E" text-anchor="middle">V1: "Hello"</text>
  <text x="870" y="275" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="600" fill="#D9363E" text-anchor="start">已回退</text>
  <rect x="662" y="302" width="260" height="98" rx="8" fill="#FFFFFF" stroke="#D4D4D0" stroke-width="1.3"/>
  <text x="672" y="320" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="normal" fill="#666664" text-anchor="start">执行后运行 git status</text>
  <rect x="672" y="330" width="240" height="42" rx="6" fill="#F7F7F5" stroke="#D4D4D0" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="792" y="348" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" font-weight="normal" fill="#666664" text-anchor="middle">nothing to commit,</text>
  <text x="792" y="364" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" font-weight="normal" fill="#666664" text-anchor="middle">working tree clean</text>
  <text x="792" y="391" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="10.5" font-weight="normal" fill="#D9363E" text-anchor="middle">工作目录彻底还原为 V1 快照</text>
  <text x="792" y="424" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#2C2C2B" text-anchor="middle">三层全部退回 V1；未提交过的</text>
  <text x="792" y="444" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="normal" fill="#666664" text-anchor="middle">本地修改一旦覆盖不可恢复。</text>
  <text x="480" y="486" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="11.5" font-weight="normal" fill="#666664" text-anchor="middle">规律：从 --soft 到 --mixed 再到 --hard，被回退到 V1 的层级依次从 1 层（仅 HEAD）扩展到全部 3 层。</text>
</svg>
